---
vector_extra_metrics: ""
vector_install_nodexporter: true
vector_version: "0.57.0-1"
vector_use_openbao: false
# Log tiering endpoints (see docs/ethquokkaops/monitoring-logs): route_tiers
# in vector.yaml ships debug/noisy streams to the 1d tier and auditd to the
# 365d tier; everything else goes to logs_host (the fleet's main tier).
vector_logs_host: "logs.ethquokkaops.io"
vector_logs_short_host: "logs2.ethquokkaops.io"
vector_logs_long_host: "logs3.ethquokkaops.io"
# OpenBao/Vault secret configuration
# Explicit KV v2 data path: without /data/, an agent whose mount-type preflight
# times out falls back to the v1 path and loops on 403 until re-auth.
vector_vault_secret_path: "secret/common/data/metric_ingress"
vector_vault_user_field: "metrics_username"
vector_vault_password_field: "metrics_password"
