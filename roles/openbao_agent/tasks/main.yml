---
- name: Install required packages
  ansible.builtin.apt:
    name:
      - gpg
    state: present
    update_cache: true
- name: Set architecture mapping
  ansible.builtin.set_fact:
    openbao_agent_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' if ansible_facts['architecture'] == 'aarch64' else ansible_facts['architecture'] }}"
- name: Download OpenBao GPG key
  ansible.builtin.get_url:
    url: https://openbao.org/assets/openbao-gpg-pub-20240618.asc
    dest: /tmp/openbao-gpg-pub.asc
    mode: "0644"
- name: Import OpenBao GPG key
  ansible.builtin.command:
    cmd: gpg --import /tmp/openbao-gpg-pub.asc
  register: openbao_agent_gpg_import_result
  changed_when: "'imported' in openbao_agent_gpg_import_result.stderr"
# Since 2.5.0 upstream ships the package as `openbao` (Conflicts/Replaces: bao).
- name: Set OpenBao package name
  ansible.builtin.set_fact:
    openbao_agent_pkg: "{{ 'openbao' if openbao_agent_version is version('2.5.0', '>=') else 'bao' }}"
- name: Set OpenBao deb path
  ansible.builtin.set_fact:
    openbao_agent_deb: "{{ openbao_agent_pkg }}_{{ openbao_agent_version }}_linux_{{ openbao_agent_arch }}.deb"
- name: Download OpenBao deb package
  ansible.builtin.get_url:
    url: "https://github.com/openbao/openbao/releases/download/v{{ openbao_agent_version }}/{{ openbao_agent_deb }}"
    dest: "/tmp/{{ openbao_agent_deb }}"
    mode: "0644"
- name: Download OpenBao deb signature
  ansible.builtin.get_url:
    url: "https://github.com/openbao/openbao/releases/download/v{{ openbao_agent_version }}/{{ openbao_agent_deb }}.gpgsig"
    dest: "/tmp/{{ openbao_agent_deb }}.gpgsig"
    mode: "0644"
- name: Verify GPG signature of OpenBao deb package
  ansible.builtin.command:
    cmd: gpg --verify /tmp/{{ openbao_agent_deb }}.gpgsig /tmp/{{ openbao_agent_deb }}
  changed_when: false
# apt's deb check refuses a declared conflict, so drop the old package first
# (remove, not purge: keeps the openbao user and /etc/openbao).
- name: Remove legacy bao package
  ansible.builtin.apt:
    name: bao
    state: absent
  when: openbao_agent_pkg == 'openbao'
- name: Install OpenBao from deb package
  ansible.builtin.apt:
    deb: "/tmp/{{ openbao_agent_deb }}"
    state: present
- name: Create openbao-agent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: openbao
    group: openbao
    mode: "0750"
  loop:
    - /etc/openbao-agent
    - /etc/openbao-agent/conf.d
    - /etc/openbao-agent/templates.d
    - /var/lib/openbao-agent
- name: Create runtime directory for agent token
  ansible.builtin.file:
    path: /run/openbao-agent
    state: directory
    owner: openbao
    group: openbao
    mode: "0750"
- name: Set OpenBao role name fact
  ansible.builtin.set_fact:
    openbao_agent_role_name: "host-{{ inventory_hostname }}"
- name: Fetch role-id from OpenBao on control node
  ansible.builtin.command:
    cmd: >
      bao read -field=role_id
      auth/{{ openbao_agent_approle_mount_path }}/role/{{ openbao_agent_role_name }}/role-id
  delegate_to: localhost
  become: false
  register: openbao_agent_role_id_result
  changed_when: false
- name: Set role-id fact
  ansible.builtin.set_fact:
    openbao_agent_role_id: "{{ openbao_agent_role_id_result.stdout }}"
- name: Deploy role-id file
  ansible.builtin.copy:
    content: "{{ openbao_agent_role_id }}"
    dest: /etc/openbao-agent/role-id
    owner: openbao
    group: openbao
    mode: "0400"
# secret_ids never expire (secret_id_ttl = 0), so minting one on every run
# would leave a valid credential behind per run. Only mint when the host has
# none; delete /etc/openbao-agent/secret-id and rerun to rotate.
- name: Check for an existing secret-id
  ansible.builtin.stat:
    path: /etc/openbao-agent/secret-id
  register: openbao_agent_secret_id_file
- name: Issue a secret-id for a host without one
  when: not openbao_agent_secret_id_file.stat.exists
  block:
    - name: Fetch secret-id from OpenBao on control node
      ansible.builtin.command:
        cmd: >
          bao write -f -field=secret_id
          auth/{{ openbao_agent_approle_mount_path }}/role/{{ openbao_agent_role_name }}/secret-id
      delegate_to: localhost
      become: false
      register: openbao_agent_secret_id_result
      changed_when: false
    - name: Set secret-id fact
      ansible.builtin.set_fact:
        openbao_agent_secret_id: "{{ openbao_agent_secret_id_result.stdout }}"
    - name: Deploy wrapped secret-id file
      ansible.builtin.copy:
        content: "{{ openbao_agent_secret_id }}"
        dest: /etc/openbao-agent/secret-id
        owner: openbao
        group: openbao
        mode: "0400"
      notify: Restart openbao-agent
- name: Deploy OpenBao agent configuration
  notify: Restart openbao-agent
  ansible.builtin.template:
    src: openbao-agent.hcl.j2
    dest: /etc/openbao-agent/agent.hcl
    owner: openbao
    group: openbao
    mode: "0640"
- name: Deploy systemd service file
  notify: Restart openbao-agent
  ansible.builtin.template:
    src: openbao-agent.service.j2
    dest: /etc/systemd/system/openbao-agent.service
    owner: root
    group: root
    mode: "0644"
- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
- name: Enable and start OpenBao agent
  ansible.builtin.systemd:
    name: openbao-agent
    enabled: true
    state: started
