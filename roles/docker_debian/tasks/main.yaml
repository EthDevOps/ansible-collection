---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  become: true
- name: Install required packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  become: true
  loop:
    - apt-transport-https
    - ca-certificates
    - curl
    - gnupg
    - lsb-release
    - python3-docker
- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_debian_gpg_key }}"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  become: true
- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] {{ docker_debian_repository }} {{ ansible_distribution_release }} stable"
    state: present
    update_cache: true
  become: true
- name: Create docker config directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
- name: Generate Docker Configuation
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
# Debian's own docker packages conflict with the docker-ce stack at the
# file level (docker-buildx ships /usr/libexec/docker/cli-plugins/docker-buildx,
# which docker-buildx-plugin also owns), so apt's automatic removal aborts
# mid-transaction and leaves dpkg broken with the daemon uninstalled.
# Remove them explicitly before installing docker-ce.
- name: Remove conflicting distro Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-cli
      - docker-buildx
      - docker-compose
      - docker-doc
      - podman-docker
    state: absent
  become: true
  when: docker_debian_package == "docker-ce"
- name: Install Docker
  ansible.builtin.apt:
    name: "{{ docker_debian_package }}"
    state: present
  become: true
- name: Ensure Docker is running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  become: true
