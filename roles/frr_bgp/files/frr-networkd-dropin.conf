# Managed by Ansible — DO NOT EDIT (ethdevops.infrastructure.frr_bgp)
#
# Zebra installs the BGP-learned routes (proto bgp) into the kernel FIB.
# systemd-networkd owns the link; networkd.conf.d/10-frr.conf tells it to leave
# foreign routes alone, but that setting is only read when networkd starts, and
# a host that has not restarted networkd since the drop-in landed still reaps
# them. Without a relationship between the two units, such a restart leaves FRR
# reporting every session Established with its prefixes received while the
# kernel FIB holds none of them, until someone runs `systemctl restart frr`.
#
# PartOf= makes systemd restart FRR whenever networkd restarts, so zebra
# re-installs the FIB on its own. frr.conf sets `bgp graceful-restart`, so the
# induced restart does not drop forwarding.
[Unit]
After=systemd-networkd.service
PartOf=systemd-networkd.service
