# Managed by Ansible — DO NOT EDIT (ethdevops.infrastructure.frr_bgp)
#
# This host runs a routing daemon. networkd's default (ManageForeignRoutes=yes)
# removes every route it did not configure itself whenever it restarts or
# reconfigures the link, which flushes zebra's BGP routes out of the kernel
# while FRR still believes they are installed. Routes from .network files are
# unaffected by this setting; netplan keeps working as before.
#
# The same goes for nexthop objects (systemd >= 256): zebra installs its routes
# with nexthop groups, and a networkd reconfigure deleted those groups, leaving
# zebra's routes uninstalled ("Kernel deleted a nexthop group ... we are still
# using", route Status: Failed) until FRR restarts.
[Network]
ManageForeignRoutes=no
ManageForeignNextHops=no
