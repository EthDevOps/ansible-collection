---
# ---- inputs -----------------------------------------------------------------
- name: Check the speaker's identity
  ansible.builtin.assert:
    that:
      - frr_bgp_local_asn is not none
      - frr_bgp_local_asn | int >= 64512 and frr_bgp_local_asn | int <= 65534
    fail_msg: frr_bgp_local_asn must be the private ASN of this host's VLAN.
- name: Derive the fabric peers from the primary /24
  when: frr_bgp_fabric_peers is not defined
  block:
    - name: Fabric peer derivation only knows the /24 convention
      ansible.builtin.assert:
        that:
          - ansible_default_ipv4.prefix | int == 24
          - frr_bgp_fabric_asn is not none
        fail_msg: >-
          Deriving the fabric peers needs frr_bgp_fabric_asn and a /24 primary
          subnet ({{ inventory_hostname }} has /{{ ansible_default_ipv4.prefix }});
          otherwise set frr_bgp_fabric_peers explicitly.
    - name: Set the fabric peers
      ansible.builtin.set_fact:
        frr_bgp_fabric_peers: "{{ _frr_bgp_fabric_peers_json | from_json }}"
      vars:
        _frr_bgp_fabric_peers_json: >-
          {%- set base = ansible_default_ipv4.network.split('.')[:3] | join('.') -%}
          [{% for svi in frr_bgp_fabric_svis -%}
          {"name": "{{ svi.name }}", "address": "{{ base }}.{{ svi.host }}", "remote_asn": {{ frr_bgp_fabric_asn | int }}}{%- if not loop.last %}, {% endif %}{% endfor %}]
- name: Check the connected announcements are /32s
  # keepalived adds a bare `virtual_ipaddress` as /32, which zebra sees as a
  # connected /32 and the route-map matches exactly. A VIP configured with its
  # subnet's prefix length never produces that route and is announced by nobody.
  ansible.builtin.assert:
    that: item is match('^([0-9]{1,3}\.){3}[0-9]{1,3}/32$')
    fail_msg: "frr_bgp_announce_connected entry {{ item }} is not a /32"
  loop: "{{ frr_bgp_announce_connected }}"
- name: Check the local speakers declare their prefixes
  ansible.builtin.assert:
    that:
      - item.prefixes | default([]) | length > 0
      - item.address is defined
      - item.remote_asn is defined
    fail_msg: "local speaker {{ item.name | default('?') }} needs address, remote_asn and a non-empty prefixes list"
  loop: "{{ frr_bgp_local_speakers }}"
  loop_control:
    label: "{{ item.name | default('?') }}"
- name: Check the router ID is not the one a local speaker uses
  # Cilium's BGP instance uses the node IP as router ID. FRR refuses an OPEN
  # whose BGP identifier equals its own, so the two must differ.
  ansible.builtin.assert:
    that: frr_bgp_router_id != ansible_default_ipv4.address
    fail_msg: >-
      {{ inventory_hostname }} runs a local speaker; set frr_bgp_router_id to
      something other than the primary IP (the cluster's router-ID pool).
  when: frr_bgp_local_speakers | length > 0
# ---- packages ---------------------------------------------------------------
# FRR from the upstream repo: Debian's 10.3 never opens a session while its BFD
# session is down, and a switch that only runs BFD for established dynamic
# peers (listen range) never brings BFD up first, so fresh starts stayed Idle.
- name: Add the FRRouting signing key
  ansible.builtin.get_url:
    url: https://deb.frrouting.org/frr/keys.gpg
    dest: /usr/share/keyrings/frrouting.gpg
    mode: "0644"
- name: Add the FRRouting apt repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/frrouting.gpg] https://deb.frrouting.org/frr {{ ansible_distribution_release }} {{ frr_bgp_frr_channel }}"
    filename: frr
    state: present
    update_cache: false
- name: Pin the FRR version
  # Priority 1001 keeps dist-upgrade (os-updates) from moving FRR past the pin
  # and lets the role downgrade to it.
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/frr
    mode: "0644"
    content: |
      Package: frr frr-pythontools
      Pin: version {{ frr_bgp_frr_version }}
      Pin-Priority: 1001
- name: Update apt cache (tolerate broken third-party repos)
  ansible.builtin.apt:
    update_cache: true
  register: frr_bgp_apt_update
  failed_when: false
- name: Warn if apt cache update did not fully succeed
  when: frr_bgp_apt_update.failed | default(false) or 'Failed to fetch' in (frr_bgp_apt_update.stderr | default(''))
  ansible.builtin.debug:
    msg: >-
      apt-get update reported errors; continuing with the existing cache.
      Details: {{ frr_bgp_apt_update.msg | default(frr_bgp_apt_update.stderr | default('unknown')) }}
- name: Install FRR
  # The package upgrade restarts FRR (and its sessions) once per version bump.
  # A check run has not added the repo, so the pinned version is unknown there.
  register: frr_bgp_install
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.apt:
    name:
      - "frr={{ frr_bgp_frr_version }}"
      - "frr-pythontools={{ frr_bgp_frr_version }}"
    allow_downgrade: true
# ---- systemd-networkd must leave zebra's routes alone ------------------------
- name: Create the networkd.conf drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/networkd.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Stop networkd from reaping foreign routes
  # Read when networkd starts. Not restarting networkd here on purpose: the
  # frr.service drop-in below covers the window until the next restart.
  ansible.builtin.copy:
    src: networkd-foreign-routes.conf
    dest: /etc/systemd/networkd.conf.d/10-frr.conf
    owner: root
    group: root
    mode: '0644'
- name: Create the frr.service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/frr.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Tie frr.service to systemd-networkd
  ansible.builtin.copy:
    src: frr-networkd-dropin.conf
    dest: /etc/systemd/system/frr.service.d/10-networkd.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd
# ---- FRR --------------------------------------------------------------------
# Everything below needs the package on disk (/etc/frr, vtysh, the units). A
# check run on a host without FRR can only report the install above.
- name: Configure FRR and its exporter
  ansible.builtin.include_tasks: configure.yaml
  when: not (ansible_check_mode and (frr_bgp_install is changed or frr_bgp_install is failed))
