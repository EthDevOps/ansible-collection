---
k3s_token: ""
k3s_network_backend: host-gw
# Local user that owns the kubeconfig written to <home>/.kube/config on
# server nodes. Pinned to a fixed user instead of the Ansible connection
# user, so the location and permissions are deterministic.
k3s_user: root
k3s_version: v1.35.8+k3s1
# Set true to let the role upgrade a running cluster to k3s_version: the new
# binary is downloaded even when the installed one differs, and the k3s
# service is restarted afterwards (servers one at a time, agents throttled).
# Leave false for normal runs — a version mismatch then only produces a
# warning, because swapping the binary of a running cluster without a
# supervised cordon/drain/restart would apply on the next unplanned reboot.
k3s_upgrade: false
k3s_systemd_dir: /etc/systemd/system
k3s_server_location: /var/lib/rancher/k3s
k3s_server_ip: "{{ hostvars[groups['k3s_server'][0]]['ansible_host'] | default(groups['k3s_server'][0]) }}"
k3s_server_extra_args: >-
  --node-external-ip={{ hostvars[inventory_hostname]['primary_ip4'] }}
k3s_agent_extra_args: >-
  --node-external-ip={{ hostvars[inventory_hostname]['primary_ip4'] }}
# Enable this if you want to cleanup and uninstall the k3s service on the host
k3s_cleanup: false
# Enable this if you also want to remove the persisten volumes created by the "local-path" storage class
k3s_cleanup_localpath_persistent_volumes: false
k3s_etcd_enabled: false
k3s_etcd_snapshot_enabled: false
k3s_etcd_snapshot_schedule_cron: "0 */12 * * *"
k3s_etcd_snapshot_retention: 5
k3s_etcd_snapshot_bucket: k3s-etcd-snapshots
k3s_etcd_snapshot_endpoint: localhost:9000
k3s_etcd_snapshot_access_key: minio
k3s_etcd_snapshot_secret_key: minio123
k3s_etcd_snapshot_skip_ssl_verify: false
k3s_etcd_snapshot_region: us-east-1
k3s_etcd_snapshot_folder: snapshots
k3s_etcd_snapshot_insecure: false
k3s_etcd_snapshot_timeout: 5m0s
k3s_docker_cache: ""
# CIS hardening (see https://docs.k3s.io/security/hardening-guide)
k3s_hardening_enabled: false
k3s_audit_log_maxage: 30
k3s_audit_log_maxbackup: 10
k3s_audit_log_maxsize: 100
# Local user (created by the shipper role, e.g. the vector .deb) that needs
# read access to the kube-apiserver audit log. Empty string disables the
# extra ACL grants — k3s's canonical 0700 root:root paths stay otherwise
# untouched. Set to "vector" on hosts that ship the audit log centrally.
k3s_audit_log_reader_user: ""
