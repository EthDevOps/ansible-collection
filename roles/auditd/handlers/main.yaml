---
- name: Restart auditd
  ansible.builtin.systemd:
    name: auditd
    state: restarted
# Mirrors the k3s role's shipper handlers. Vector's file source has been
# observed to silently wedge if it couldn't read the log on first scan; a
# one-shot restart re-bootstraps the source against the now-readable path.
# failed_when:false keeps the handler harmless on hosts where vector-multi
# was named differently or has been removed.
- name: Reload vector
  ansible.builtin.systemd:
    name: vector-multi
    state: reloaded
- name: Restart audit log shipper
  ansible.builtin.systemd:
    name: vector-multi
    state: restarted
  failed_when: false
