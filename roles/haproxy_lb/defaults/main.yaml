---
haproxy_lb_sites_insecure: false
haproxy_lb_stats_user: user
haproxy_lb_stats_password: somepassword
haproxy_lb_auth: []
haproxy_lb_rate_limit_per_min: 1500
haproxy_lb_rate_limit_targets: []
haproxy_lb_rate_limit_exclude: []
# Log-only mode: track every domain and log rate-limit enter/exit events above
# haproxy_lb_rate_limit_per_min, but reject nothing (targets are ignored).
haproxy_lb_rate_limit_shadow: false
# Source IPs/CIDRs of proxies in front of the LBs (e.g. Cloudflare) whose
# X-Forwarded-For is passed on; from everyone else it is stripped.
haproxy_lb_trusted_proxies: []
haproxy_lb_clusters: []
haproxy_lb_sites: []
haproxy_lb_tunnels: []
haproxy_lb_redirects: []
haproxy_lb_k8s_services: []
# Host name -> host vars (needs primary_ip4; NetBox services for domain groups
# and Warpgate). Unset = the play's hostvars (set in tasks, not here, so the
# fallback is evaluated once).
# haproxy_lb_hostvars: {}
# Custom backend configuration snippets for HAProxy backends
# Keyed by backend name, value is raw HAProxy config to inject
# Supported backend types and their keys:
#   - Static sites: site name (e.g., "mysite")
#   - K8s HTTP services: "cluster_namespace_servicename" (e.g., "prod_default_myapp")
#   - K8s TCP services: "tcp_cluster_namespace_servicename" (e.g., "tcp_prod_default_postgres")
#   - Domain groups: domain name (e.g., "example.com")
haproxy_lb_backend_extra_config: {}
# Exact haproxy-awslc version to pin via /etc/apt/preferences.d (blocks
# dist-upgrade / unattended-upgrades too). Empty = unpinned, latest from repo.
haproxy_lb_awslc_version: ""
haproxy_lb_quic_enabled: false
haproxy_lb_cache_enabled: false
# When true, the :80 frontend redirects HTTP -> HTTPS (301) for any service
# that does not have allow_http: true (or ethquokkaops.io/allow-http: "true"
# for K8s, custom_fields.allow_http for domain-group services).
# Leave off until you have observed HTTP traffic logs to know which services
# need the override.
haproxy_lb_force_https: false
# When true, the http/https frontends log every request as JSON to the local
# Vector (UDP 127.0.0.1:5140) instead of journald; Vector ships normal requests
# to the 1d log tier. K8s services can opt out of normal-request logging with
# ethquokkaops.io/dontlog-normal: "true".
haproxy_lb_access_log: false
# When set, a single `warpgate` backend (HTTPS, verify none) is generated and
# services opted in via discovery are routed to it:
#   - K8s: ethquokkaops.io/warpgate-expose: "web" + ethquokkaops.io/domain
#   - NetBox: custom_fields.expose_mode: internal + expose_domain
haproxy_lb_warpgate_host: ""
haproxy_lb_warpgate_port: 443
# Warpgate's own domain, e.g. eu.gate.ethdevops.io. When set, requests for a
# K8s service's real domain reach Warpgate as <warpgate-name>.<this> (except
# /@warpgate/api/sso/), because Warpgate only keeps sessions on its
# external_host and subdomains. The Warpgate target's external_host must be
# that gate name. Empty = forward the real Host unchanged.
haproxy_lb_warpgate_gate_domain: ""
