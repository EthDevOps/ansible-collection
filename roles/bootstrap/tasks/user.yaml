---
- name: Ensure the default user is present
  ansible.builtin.user:
    name: "{{ bootstrap_default_user }}"
    state: present
    shell: "{{ bootstrap_user_shell }}"
    create_home: true
- name: Allow default user to have passwordless sudo
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    state: present
    regexp: "^%{{ bootstrap_default_user }}"
    line: "{{ bootstrap_default_user }} ALL=(ALL) NOPASSWD: ALL"
    validate: visudo -cf %s
- name: Ensure the user is in the sudo group (if required)
  ansible.builtin.user:
    name: "{{ bootstrap_default_user }}"
    groups: sudo
    append: true
- name: Add default SSH keys for the default user
  ansible.posix.authorized_key:
    user: "{{ bootstrap_default_user }}"
    state: present
    key: "{{ item }}"
  loop: "{{ bootstrap_default_user_sshkeys }}"
- name: Setup the Warpgate SSH users
  vars:
    # Warpgate always relies on devops; the project's targets may log in as another user.
    _warpgate_users: "{{ (['devops', bootstrap_ssh_username] | unique) | difference([bootstrap_default_user]) }}"
  block:
    - name: Ensure the Warpgate SSH users are present
      ansible.builtin.user:
        name: "{{ item }}"
        state: present
        shell: "{{ bootstrap_user_shell }}"
        create_home: true
      loop: "{{ _warpgate_users }}"
    - name: Allow the Warpgate SSH users to have passwordless sudo
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        state: present
        regexp: "^{{ item }} "
        line: "{{ item }} ALL=(ALL) NOPASSWD: ALL"
        validate: visudo -cf %s
      loop: "{{ _warpgate_users }}"
    - name: Add default SSH keys for the Warpgate SSH users
      ansible.posix.authorized_key:
        user: "{{ item.0 }}"
        state: present
        key: "{{ item.1 }}"
      loop: "{{ _warpgate_users | product(bootstrap_default_user_sshkeys) | list }}"
- name: Ensure users are present
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: present
    shell: /bin/bash
  loop: "{{ bootstrap_additional_users }}"
  loop_control:
    label: "{{ item.name }}"
- name: Create .ssh directory for each user
  ansible.builtin.file:
    path: "/home/{{ item.name }}/.ssh"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: '0700'
  loop: "{{ bootstrap_additional_users }}"
  loop_control:
    label: "{{ item.name }}"
- name: Add SSH keys for each user
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    state: present
    key: "{{ item.1 }}"
  loop: "{{ bootstrap_additional_users | subelements('sshkeys') }}"
- name: Allow passwordless sudo for users
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    line: "{{ item.name }} ALL=(ALL) NOPASSWD: ALL"
    validate: "/usr/sbin/visudo -cf %s"
  loop: "{{ bootstrap_additional_users }}"
  loop_control:
    label: "{{ item.name }}"
- name: Drop flag.txt into root's and each bootstrapped user's home
  ansible.builtin.copy:
    src: flag.txt
    dest: "{{ '/root' if item == 'root' else '/home/' ~ item }}/flag.txt"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: '0644'
  loop: "{{ (['root', bootstrap_default_user, 'devops', bootstrap_ssh_username] + bootstrap_additional_users | map(attribute='name') | list) | unique }}"
